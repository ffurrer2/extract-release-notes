# SPDX-License-Identifier: MIT
name: CodeQL

on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  schedule:
  - cron: '0 12 * * 0'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    uses: ffurrer2/reusable-workflows/.github/workflows/codeql.yml@28e7a9f539412b42798dc421cf544a86de495256 # v1.4.0
    with:
      languages: '["javascript"]'
      config-file: .github/codeql/codeql-config.yml
