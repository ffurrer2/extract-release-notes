# SPDX-License-Identifier: MIT
name: CodeQL

on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  schedule:
  - cron: '0 12 * * 0'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    uses: ffurrer2/reusable-workflows/.github/workflows/codeql.yml@f6c890cfe3b472544c681519989f92aa04c929c7 # v1.5.0
    with:
      languages: '["javascript"]'
      config-file: .github/codeql/codeql-config.yml
