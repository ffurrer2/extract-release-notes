# SPDX-License-Identifier: MIT
name: CodeQL

on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  schedule:
  - cron: '0 12 * * 0'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    uses: ffurrer2/reusable-workflows/.github/workflows/codeql.yml@78237bd23f48c7fda2cbfe3658a8699a701c9ab2 # v1.7.0
    with:
      languages: '["javascript"]'
      config-file: .github/codeql/codeql-config.yml
