# SPDX-License-Identifier: MIT
name: CodeQL

on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  schedule:
  - cron: '0 12 * * 0'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    uses: ffurrer2/reusable-workflows/.github/workflows/codeql.yml@34d1e7530ca9bb877d180dca7f46a3789d4b119b # v1.3.0
    with:
      languages: '["javascript"]'
      config-file: .github/codeql/codeql-config.yml
