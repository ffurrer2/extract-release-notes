# SPDX-License-Identifier: MIT
name: CodeQL

on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  schedule:
  - cron: '0 12 * * 0'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    uses: ffurrer2/reusable-workflows/.github/workflows/codeql.yml@2e77d0591a0f5b8559ce2e22314222c309e6eedf # v1.2.0
    with:
      languages: '["javascript"]'
      config-file: .github/codeql/codeql-config.yml
