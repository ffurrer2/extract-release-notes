# SPDX-License-Identifier: MIT
name: yamllint

on:
  push:
    branches:
    - main
    paths:
    - '**.ya?ml'
  pull_request:
    branches:
    - main
    paths:
    - '**.ya?ml'

permissions:
  contents: read

jobs:
  yamllint:
    name: yamllint
    uses: ffurrer2/reusable-workflows/.github/workflows/yamllint.yml@f6c890cfe3b472544c681519989f92aa04c929c7 # v1.5.0
