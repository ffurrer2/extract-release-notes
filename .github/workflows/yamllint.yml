name: yamllint

on:
  push:
    branches:
    - main
    paths:
    - '**.ya?ml'
  pull_request:
    branches:
    - main
    paths:
    - '**.ya?ml'

permissions:
  contents: read

jobs:
  yamllint:
    name: yamllint
    uses: ffurrer2/reusable-workflows/.github/workflows/yamllint.yml@34d1e7530ca9bb877d180dca7f46a3789d4b119b # v1.3.0
