# SPDX-License-Identifier: MIT
name: yamllint

on:
  push:
    branches:
    - main
    paths:
    - '**.ya?ml'
  pull_request:
    branches:
    - main
    paths:
    - '**.ya?ml'

permissions:
  contents: read

jobs:
  yamllint:
    name: yamllint
    uses: ffurrer2/reusable-workflows/.github/workflows/yamllint.yml@78237bd23f48c7fda2cbfe3658a8699a701c9ab2 # v1.7.0
