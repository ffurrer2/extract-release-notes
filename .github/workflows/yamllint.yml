# SPDX-License-Identifier: MIT
name: yamllint

on:
  push:
    branches:
    - main
    paths:
    - '**.ya?ml'
  pull_request:
    branches:
    - main
    paths:
    - '**.ya?ml'

permissions:
  contents: read

jobs:
  yamllint:
    name: yamllint
    uses: ffurrer2/reusable-workflows/.github/workflows/yamllint.yml@28e7a9f539412b42798dc421cf544a86de495256 # v1.4.0
